name: IJC-GAJIU CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pandas pyarrow numpy jsonschema matplotlib
      - name: Verify 12D Cardinality
        run: python3 src/ontology/verify_cardinality.py
      - name: Run Unit Test Suite
        run: python3 -m unittest discover -s tests -v
