[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "ijc-global-ai-justice-universe"
version = "1.0.0"
description = "IJC Global AI & Justice Innovation Universe — 12D Combinatorial Research & Governance Architecture"
readme = "README.md"
requires-python = ">=3.11"
authors = [{name = "Cecep Mustafa", email = "cecepmustafa97@gmail.com"}]
dependencies = [
    "pandas>=2.0",
    "pyarrow>=14.0",
    "numpy>=1.26",
    "jsonschema>=4.20",
    "matplotlib>=3.8",
]

[tool.setuptools.packages.find]
where = ["."]
include = ["src*"]
